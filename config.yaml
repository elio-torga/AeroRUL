# =============================================================================
# AeroRUL - central configuration
# Every tunable of the system lives here. Code never hard-codes these values.
# =============================================================================

project:
  name: AeroRUL
  random_seed: 42
  log_level: INFO

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external
  models_dir: models
  reports_dir: reports
  figures_dir: reports/figures
  cache_dir: .cache

data:
  datasets: [FD001, FD002, FD003, FD004]
  # Number of distinct operating regimes per sub-dataset (C-MAPSS documentation).
  n_operating_conditions:
    FD001: 1
    FD002: 6
    FD003: 1
    FD004: 6
  # Sensors carrying degradation signal. s1, s5, s6, s10, s16, s18, s19 are
  # constant (or regime-only) and are discarded - see notebook 01.
  sensors: [s2, s3, s4, s7, s8, s9, s11, s12, s13, s14, s15, s17, s20, s21]
  operating_settings: [op_setting_1, op_setting_2, op_setting_3]

target:
  # Piece-wise linear degradation target: RUL is capped at max_rul because an
  # engine shows no measurable degradation early in life.
  max_rul: 125
  # Compare test predictions against the clipped ground truth (literature standard).
  clip_test_targets: true

split:
  # Engine-level hold-out: whole engines go to validation, never single cycles.
  validation_fraction: 0.2
  # Validation engines are evaluated at random truncation points so that the
  # validation distribution matches the official (truncated) test set.
  n_cuts_per_engine: 10
  min_cycles_before_cut: 30
  # Consecutive cycles of one engine are highly autocorrelated: keeping every
  # k-th training row halves compute with negligible information loss.
  train_row_stride: 2

features:
  rolling_windows: [5, 10, 20, 30]
  rolling_stats: [mean, std, min, max, skew, kurt]
  ewm_spans: [5, 10, 20]
  lags: [1, 3, 5]
  diff_smoothing_span: 10   # 1st/2nd differences are taken on an EWMA-smoothed signal
  slope_windows: [10, 30]   # rolling OLS slope = local degradation rate
  # Physically-motivated sensor interactions (see README > Feature engineering)
  interaction_span: 10
  interaction_pairs:
    - [s2, s3]     # T24 x T30   : LPC -> HPC temperature rise
    - [s3, s4]     # T30 x T50   : hot-section thermal load
    - [s4, s11]    # T50 x Ps30  : turbine temperature vs HPC static pressure
    - [s7, s12]    # P30 x phi   : HPC pressure vs fuel-flow ratio
    - [s11, s12]   # Ps30 x phi
    - [s9, s14]    # Nc x NRc    : physical vs corrected core speed
    - [s8, s13]    # Nf x NRf    : physical vs corrected fan speed
    - [s15, s4]    # BPR x T50
    - [s17, s4]    # htBleed x T50
    - [s20, s21]   # W31 x W32   : HPT / LPT coolant bleed
  health_indicator_span: 10

selection:
  variance_threshold: 1.0e-6
  correlation_threshold: 0.98
  top_k: 120
  importance_sample_size: 15000
  importance_n_estimators: 80

models:
  ridge:
    alpha: 10.0
  random_forest:
    n_estimators: 150
    max_depth: 12
    min_samples_leaf: 8
    max_features: 0.33
  extra_trees:
    n_estimators: 150
    max_depth: 14
    min_samples_leaf: 5
    max_features: 0.5
  hist_gradient_boosting:
    learning_rate: 0.05
    max_iter: 500
    max_leaf_nodes: 31
    min_samples_leaf: 40
    l2_regularization: 1.0
  stacking:
    cv_folds: 5
    final_alpha: 1.0          # positive Ridge meta-learner -> interpretable weights

tuning:
  enabled: true
  n_iter: 12
  cv_folds: 3
  scoring: neg_root_mean_squared_error
  param_distributions:
    learning_rate: {dist: loguniform, low: 0.02, high: 0.15}
    max_iter: {dist: randint, low: 200, high: 800}
    max_leaf_nodes: {dist: choice, values: [15, 31, 63]}
    min_samples_leaf: {dist: choice, values: [20, 40, 80, 160]}
    l2_regularization: {dist: loguniform, low: 0.001, high: 10.0}
    max_features: {dist: choice, values: [0.5, 0.8, 1.0]}

uncertainty:
  # Conformalized Quantile Regression (CQR): quantile GBMs + conformal
  # correction on the validation engines -> finite-sample coverage guarantee.
  alpha: 0.2                  # 80 % prediction interval
  quantile_max_iter: 300

calibration:
  # Isotonic recalibration of point predictions; adopted only if it improves
  # cross-validated RMSE on validation cut points by at least min_gain.
  isotonic: true
  min_gain: 0.01

evaluation:
  # PHM08 prognostic window: a prediction is "accurate" if
  # -13 <= (predicted - true) <= +10 cycles (late predictions are tolerated less).
  phm_early_tolerance: 13
  phm_late_tolerance: 10
  alert_horizon: 30           # cycles - used for alerting precision/recall

business:
  # Illustrative economics (USD) - replace with your fleet's figures.
  unplanned_failure_cost: 1500000    # AOG event, secondary damage, disruption
  planned_maintenance_cost: 250000   # scheduled shop visit
  cost_per_lost_cycle: 1200          # value of useful life discarded by early removal
  maintenance_lead_time: 10          # cycles between decision and removal
  safety_margin: 5                   # extra cycles added to the lead time
  risk_thresholds:                   # used by the Streamlit app
    critical: 30
    warning: 60

explainability:
  n_background: 200
  n_explain: 300
  top_n_features: 15
